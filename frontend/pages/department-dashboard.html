<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Department Dashboard | ApniLeap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="../css/styles.css" rel="stylesheet">
</head>
<body>

<nav class="al-navbar navbar navbar-expand-xl">
  <a class="al-brand" href="dashboard.html">APNI<span>LEAP</span></a>
  <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain" aria-controls="navMain" aria-expanded="false" aria-label="Toggle navigation">
    <span class="navbar-toggler-icon"></span>
  </button>
  <div class="collapse navbar-collapse" id="navMain">
    <div class="d-flex flex-column flex-xl-row">
      <a class="nav-link active" href="dashboard.html">Dashboard</a>
      <a class="nav-link" href="reports.html">Reports</a>
      <a class="nav-link d-none" id="navAdmin" href="administration.html">Administration</a>
    </div>
    <div class="d-flex align-items-center gap-2 ms-xl-auto mt-2 mt-xl-0">
      <button class="btn btn-sm btn-outline-light d-flex align-items-center gap-1 btn-refresh-trigger" id="globalRefreshBtn" title="Refresh data in-place">
        <span class="refresh-spinner-icon">🔄</span> Refresh
      </button>
      <span class="al-user-chip" id="userChip">&nbsp;</span>
      <button class="btn btn-sm btn-outline-light" id="logoutBtn">Logout</button>
    </div>
  </div>
</nav>

<div class="al-page">
  <div class="al-page-header">
    <div>
      <p class="al-page-subtitle mb-0" id="breadcrumb">…</p>
      <h1 class="al-page-title" id="departmentTitle">Department Dashboard</h1>
      <p class="al-page-subtitle mb-0" id="departmentPeople"></p>
    </div>
    <div class="d-flex gap-2 flex-wrap">
      <button class="btn btn-al-primary btn-sm d-none" id="btnAddTheme">+ Add Theme</button>
    </div>
  </div>

  <!-- Themes section: rectangular blocks for each theme -->
  <div class="al-card mb-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div>
        <h2 class="mb-1">Themes</h2>
        <p class="text-muted mb-0" style="font-size:13.5px">Select a theme to view its mini-projects, or create a new theme.</p>
      </div>
    </div>
    <div class="row g-3" id="themeGrid">
      <div class="col-12 text-muted">Loading themes…</div>
    </div>
  </div>
</div>
<div class="modal fade" id="addThemeModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Add New Theme</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="addThemeForm">
          <div class="mb-3">
            <label class="form-label" for="newThemeTitle">Theme Name</label>
            <input class="form-control" id="newThemeTitle" maxlength="200" autocomplete="off" placeholder="e.g. Smart Education & Learning Systems" required>
          </div>
          <div class="mb-2">
            <label class="form-label" for="newThemeDesc">Description <span class="text-muted">(optional)</span></label>
            <textarea class="form-control" id="newThemeDesc" rows="3" placeholder="Brief summary of theme focus or research topics..."></textarea>
          </div>
          <div class="al-login-error" id="addThemeError" style="display:none"></div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-al-primary btn-sm" id="addThemeSubmit">Create Theme</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/api.js"></script>
<script src="../js/academic.js"></script>
<script src="../js/team-form.js"></script>
<script src="../js/rag.js"></script>
<script src="../js/project-import.js"></script>
<script src="../js/department-dashboard.js"></script>
</body>
</html>
